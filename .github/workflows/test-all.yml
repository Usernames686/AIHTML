name: Test AIHTML Applications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-fastapi:
    name: Test SlideCraft FastAPI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./servers/fastapi
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio
    
    - name: Set up environment variables
      run: |
        echo "APP_DATA_DIRECTORY=/tmp/app_data" >> $GITHUB_ENV
        echo "TEMP_DIRECTORY=/tmp/aihtml" >> $GITHUB_ENV
        echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> $GITHUB_ENV
        echo "DISABLE_ANONYMOUS_TRACKING=true" >> $GITHUB_ENV
        echo "DISABLE_IMAGE_GENERATION=true" >> $GITHUB_ENV

    - name: Run SlideCraft tests
      run: |
        pytest tests/unit/test_slidecraft.py -q

    - name: Smoke test FastAPI app
      run: |
        python -c "from api.main import app; assert any(getattr(route, 'path', None) == '/api/v1/ppt/slidecraft/generate' for route in app.routes); print('FastAPI app loaded')"

  test-nextjs:
    name: Test Main Next.js
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./servers/nextjs
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: servers/nextjs/package-lock.json
    
    - name: Install dependencies
      run: npm ci --ignore-scripts
    
    - name: Build application
      env:
        NEXT_PUBLIC_FAST_API: http://localhost:8000
        NEXT_PUBLIC_URL: http://localhost:3000
      run: npm run build
    
